<!DOCTYPE Html>
<html lang="ar" dir="rtl">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width , initial-scale=1.0"/>
        <link rel="icon" type="img/png" href="sign in/ChatGPT Image Aug 31, 2026, 10_31_34 AM.png">
        <title>انشاء الحساب</title>
        <link rel="Stylesheet" href="sign in/sign.css">
        <link href="https://fonts.googleapis.com/icon?family=Material+Icons"rel="stylesheet">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=arrow_right_alt" />
        <script src="sign in/main.js" defer></script>
    </head>
    
    <body> 
        <div class="cursor"></div>
        <div class="cursor-dot"></div>
        
        <div class="container">
            <a class="GBC" href="">
                <span class="go-back">
                    <span class="material-symbols-outlined">arrow_right_alt</span> 
                    الرجوع الى الصفحة
                </span>
            </a> 
            <img class="teeth" src="sign in/ChatGPT Image Aug 31, 2026, 10_31_34 AM.png" alt="">
            <p class="pls">لانشاء الحساب :</p>
            <p>يرجى كتابة المعلومات بدقة للحصول على أعلى خدمة من الموقع .</p>
                <form action="">
                    
                    <div class="first-name">
                        <section class="field">
                            <input type="text" placeholder=" " required/>
                            <label>
                                <span class="material-icons">person</span>
                                <i> الاسم الاول </i>
                            </label> 
                        </section>
                        
                        <section class="field">
                            <input type="text" placeholder=" " required/>
                            <label>
                                <span class="material-icons">person</span>
                                <i>الاسم الثاني</i>
                            </label>
                        </section>
                    </div>

                    <div class="second-name">
                        <section class="field">
                            <input type="text" placeholder=" " required/>
                            <label>
                                <span class="material-icons">person</span>
                                <i> الاسم الثالث </i>
                            </label>
                        </section>
                        <section class="field">
                            <input type="text" placeholder=" " required/>
                            <label>
                                <span class="material-icons">person</span>
                                <i> الاسم الاخير </i>
                            </label>
                        </section>
                    </div>

                    <hr>

                    <div class="pass">
                        <section class="field">
                            <input type="password" placeholder=" " required/>
                            <label> 
                                <span class="material-icons">lock</span>
                                <i>كلمة المرور</i>
                            </label>
                        </section>

                        <section class="field">
                            <input type="password" placeholder=" " required/>
                            <label class="flaoting-label">
                                <span class="material-icons">lock</span>
                                <i>تأكيد كلمة المرور</i>
                            </label>
                        </section>
                    </div>
                    
                    <hr>

                    <div class="MT">
                        <section class="flight">
                            <input id="mail" type="email" placeholder=" " required/>
                            <label class="flow-label">
                                <span class="material-icons">mail</span>
                                <i>البريدالألكتروني</i>
                            </label>
                        </section>

                        <section class="float">
                            <input id="teli" type="tel" placeholder=" " required/>
                            <label class="flight-label">
                                <span class="material-icons">call</span>
                                <i>رقم الهاتف</i>
                            </label>
                        </section>
                    </div>
                    

                    <div class="pragraph">
                        <button><span class="acc">انشاء الحساب !</span></button>
                    </div>
                        <span class="sign">اذا كان لديك حساب بالفعل! <a class="outside" href=" ">سجل دخولك ؟</a></span>
                </form>
        </div>
        <div class="safe">
            <img class="Modern" src="sign in/Modern Arabic Dental Clinic Poster.png" alt="">
        </div>
    </body>
</html>
